<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم خودکار صدور گواهی</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body {
            font-family: Tahoma, 'Segoe UI', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .date-group {
            display: flex;
            gap: 10px;
        }
        .date-group input {
            flex: 1;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-folder {
            background-color: #6c757d;
            width: 100%;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .btn-folder:hover {
            background-color: #5a6268;
        }
        .btn-today {
            background-color: #28a745;
        }
        .btn-submit {
            width: 100%;
            background-color: #17a2b8;
            font-size: 16px;
            margin-top: 20px;
        }
        .btn-submit:hover {
            background-color: #138496;
        }
        .folder-section {
            background-color: #eef2f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #dcdcdc;
        }
        .status {
            font-size: 13px;
            color: #dc3545;
            text-align: center;
            margin-top: 5px;
            font-weight: bold;
        }
        .status.success {
            color: #28a745;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>سیستم خودکار صدور گواهی</h2>

    <!-- بخش انتخاب پوشه -->
    <div class="folder-section">
        <button type="button" class="btn-folder" onclick="selectFolder()">۱. انتخاب پوشه کاری (مسیر فایل‌ها)</button>
        <div id="folderStatus" class="status">پوشه‌ای انتخاب نشده است. دسترسی به مسیر فایل‌ها لازم است.</div>
        
        <div class="form-group" style="margin-top: 15px;">
            <label for="wordFileName">نام فایل ورد (نمونه):</label>
            <input type="text" id="wordFileName" value="فرم نمونه.docx" dir="ltr" style="text-align: left;">
        </div>
        <div class="form-group">
            <label for="excelFileName">نام فایل اکسل:</label>
            <input type="text" id="excelFileName" value="Copy of Copy of اسامی.xlsx" dir="ltr" style="text-align: left;">
        </div>
    </div>

    <!-- فرم ورود اطلاعات -->
    <div class="form-group">
        <label for="gender">جنسیت:</label>
        <select id="gender">
            <option value="آقای">آقای</option>
            <option value="خانم">خانم</option>
        </select>
    </div>

    <div class="form-group">
        <label for="fullName">نام و نام خانوادگی:</label>
        <input type="text" id="fullName" placeholder="مثال: علی احمدی">
    </div>

    <div class="form-group">
        <label for="nationalId">کد ملی:</label>
        <input type="text" id="nationalId" placeholder="مثال: 1234567890">
    </div>

    <div class="form-group">
        <label for="dateField">تاریخ:</label>
        <div class="date-group">
            <input type="text" id="dateField">
            <button type="button" class="btn-today" onclick="setTodayDate()">درج تاریخ امروز</button>
        </div>
    </div>

    <button type="button" class="btn-submit" onclick="processFiles()">۲. ثبت و ذخیره مستقیم در پوشه</button>
</div>

<script>
    let directoryHandle = null;

    // تابع انتخاب پوشه از سیستم کاربر
    async function selectFolder() {
        try {
            // درخواست انتخاب پوشه از کاربر
            directoryHandle = await window.showDirectoryPicker({
                mode: 'readwrite' // درخواست اجازه خواندن و نوشتن
            });
            const statusEl = document.getElementById('folderStatus');
            statusEl.textContent = `پوشه '${directoryHandle.name}' متصل شد. آماده کار!`;
            statusEl.className = 'status success';
        } catch (error) {
            console.error(error);
            if (error.name !== 'AbortError') {
                alert("خطا در دسترسی به پوشه. مرورگر شما باید از این قابلیت پشتیبانی کند (کروم یا اج).");
            }
        }
    }

    function setTodayDate() {
        const today = new Date();
        const options = { year: 'numeric', month: '2-digit', day: '2-digit' };
        let persianDate = new Intl.DateTimeFormat('fa-IR', options).format(today);
        
        const persianNumbers = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
        const arabicNumbers  = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        for(let i=0; i<10; i++) {
            persianDate = persianDate.replace(persianNumbers[i], i).replace(arabicNumbers[i], i);
        }
        
        document.getElementById('dateField').value = persianDate;
    }

    function replacePlaceholders(xmlString, data) {
        let updatedXml = xmlString;
        updatedXml = updatedXml.replace(/\(جنیست\)/g, data.gender);
        updatedXml = updatedXml.replace(/\(نام و نام خانوادگی\)/g, data.fullName);
        updatedXml = updatedXml.replace(/\(کد ملی\)/g, data.nationalId);
        
        let fixedDate = '\u200E' + data.date + '\u200E';
        updatedXml = updatedXml.replace(/\(تاریخ امروز\)/g, fixedDate);
        updatedXml = updatedXml.replace(/\(شماره\)/g, data.newNumber);
        
        return updatedXml;
    }

    async function processFiles() {
        if (!directoryHandle) {
            alert("لطفاً ابتدا روی دکمه 'انتخاب پوشه کاری' کلیک کنید و مسیر مورد نظر را مشخص کنید.");
            return;
        }

        const gender = document.getElementById('gender').value;
        const fullName = document.getElementById('fullName').value;
        const nationalId = document.getElementById('nationalId').value;
        const date = document.getElementById('dateField').value;
        const wordName = document.getElementById('wordFileName').value;
        const excelName = document.getElementById('excelFileName').value;

        if (!fullName || !nationalId || !date) {
            alert("لطفاً تمام فیلدها را پر کنید.");
            return;
        }

        try {
            // ==========================================
            // خواندن فایل ها مستقیماً از پوشه انتخاب شده
            // ==========================================
            let excelFileHandle, wordFileHandle;
            
            try {
                excelFileHandle = await directoryHandle.getFileHandle(excelName);
            } catch (e) {
                alert(`فایل اکسل با نام '${excelName}' در این پوشه پیدا نشد!`); return;
            }

            try {
                wordFileHandle = await directoryHandle.getFileHandle(wordName);
            } catch (e) {
                alert(`فایل ورد با نام '${wordName}' در این پوشه پیدا نشد!`); return;
            }

            const excelFile = await excelFileHandle.getFile();
            const excelBuffer = await excelFile.arrayBuffer();

            const wordFile = await wordFileHandle.getFile();
            const wordBuffer = await wordFile.arrayBuffer();

            // ==========================================
            // پردازش اکسل
            // ==========================================
            const workbook = XLSX.read(excelBuffer, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const aoa = XLSX.utils.sheet_to_json(worksheet, {header: 1});
            
            let maxNumber = 0;
            for (let i = 1; i < aoa.length; i++) {
                const row = aoa[i];
                if (row && row.length > 0) {
                    let num = parseInt(row[row.length - 1], 10); 
                    if (!isNaN(num) && num > maxNumber) {
                        maxNumber = num;
                    }
                }
            }
            
            const newNumber = maxNumber > 0 ? maxNumber + 1 : 1;
            aoa.push([fullName, gender, date, nationalId, newNumber]);

            const newWorksheet = XLSX.utils.aoa_to_sheet(aoa);
            workbook.Sheets[firstSheetName] = newWorksheet;
            const excelOutput = XLSX.write(workbook, {bookType:'xlsx', type:'array'});

            // ==========================================
            // پردازش ورد
            // ==========================================
            const zip = new JSZip();
            const loadedZip = await zip.loadAsync(wordBuffer);
            
            const dataToReplace = {
                gender: gender,
                fullName: fullName,
                nationalId: nationalId,
                date: date,
                newNumber: newNumber.toString()
            };

            if (loadedZip.file("word/document.xml")) {
                let documentXml = await loadedZip.file("word/document.xml").async("string");
                documentXml = replacePlaceholders(documentXml, dataToReplace);
                loadedZip.file("word/document.xml", documentXml);
            }

            const fileNames = Object.keys(loadedZip.files);
            const headerFiles = fileNames.filter(name => name.startsWith("word/header") && name.endsWith(".xml"));
            for (let i = 0; i < headerFiles.length; i++) {
                let headerFileName = headerFiles[i];
                let headerXml = await loadedZip.file(headerFileName).async("string");
                headerXml = replacePlaceholders(headerXml, dataToReplace);
                loadedZip.file(headerFileName, headerXml);
            }

            const wordOutput = await loadedZip.generateAsync({type: "arraybuffer"});

            // ==========================================
            // ذخیره فایل ها مستقیماً در همان پوشه (بدون دانلود)
            // ==========================================
            
            // 1. آپدیت فایل اکسل (بازنویسی فایل موجود)
            const excelWritable = await excelFileHandle.createWritable();
            await excelWritable.write(excelOutput);
            await excelWritable.close();

            // 2. ذخیره فایل ورد با نام شخص جدید
            const newWordFileName = `گواهی_${fullName}.docx`;
            const newWordFileHandle = await directoryHandle.getFileHandle(newWordFileName, { create: true });
            const wordWritable = await newWordFileHandle.createWritable();
            await wordWritable.write(wordOutput);
            await wordWritable.close();

            alert(`عملیات با موفقیت انجام شد!\nفایل اکسل آپدیت شد و گواهی جدید با نام '${newWordFileName}' در همان پوشه ذخیره گردید.`);
            
            // پاک کردن فرم برای نفر بعدی
            document.getElementById('fullName').value = '';
            document.getElementById('nationalId').value = '';

        } catch (error) {
            console.error(error);
            alert("خطایی در پردازش رخ داد. مطمئن شوید فایل اکسل یا ورد در سیستم شما توسط برنامه دیگری (مثل خود نرم افزار اکسل) باز نباشد.");
        }
    }
    
    // مقداردهی اولیه تاریخ در هنگام باز شدن صفحه
    setTodayDate();
</script>

</body>
</html>
